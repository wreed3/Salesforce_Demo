trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - preprod
      - main
  paths:
    exclude:
    - README.md
    - azure-pipelines.yml
stages:
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      - job: BuildJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Building the application..."
              npm install
              npm run build
            displayName: 'Build the application'

  - stage: DeployToDev
    displayName: 'Deploy to Development'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - deployment: DeployDev
        environment: dev
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Deploying to Development environment..."
            displayName: 'Deployment to Development'

  - stage: DeployToQA
    displayName: 'Deploy to QA'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/qa'))
    jobs:
      - deployment: DeployQA
        environment: qa
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Deploying to QA environment..."
            displayName: 'Deployment to QA'

  - stage: DeployToUAT
    displayName: 'Deploy to UAT'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/uat'))
    jobs:
      - deployment: DeployUAT
        environment: uat
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Deploying to UAT environment..."
            displayName: 'Deployment to UAT'

  - stage: DeployToPreProd
    displayName: 'Deploy to Preproduction'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/preprod'))
    jobs:
      - deployment: DeployPreProd
        environment: preprod
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Deploying to Preproduction environment..."
            displayName: 'Deployment to Preproduction'

  - stage: DeployToProd
    displayName: 'Deploy to Production'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProd
        environment: production
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Deploying to Production environment..."
            displayName: 'Deployment to Production'




